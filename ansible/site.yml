---
- name: Deploy the quantum R&D tool stack
  hosts: all
  gather_facts: true

  tasks:
    - name: Fail early on unsupported distributions
      ansible.builtin.assert:
        that: ansible_facts['distribution'] == "Ubuntu"
        fail_msg: >
          This playbook targets Ubuntu; {{ ansible_facts['distribution'] }} is not
          supported. The Docker tasks below use the Debian apt repository.

    # --- Docker ---

    - name: Install prerequisites for the Docker repository
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true
        cache_valid_time: 3600
      become: true

    - name: Ensure the keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      become: true

    - name: Fetch the Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
      become: true

    - name: Write the Docker apt source
      ansible.builtin.copy:
        content: >-
          deb [arch={{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture'] }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
        dest: /etc/apt/sources.list.d/docker.list
        mode: '0644'
      become: true

    - name: Install Docker Engine and the compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
      become: true

    - name: Ensure the Docker service is running
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true
      become: true

    - name: Add the current user to the docker group
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        groups: docker
        append: true
      become: true

    # --- Deployment ---

    - name: Ensure the deployment directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_id'] }}"
        mode: '0755'
      loop:
        - "{{ deploy_dir }}"
        - "{{ deploy_dir }}/data"
        - "{{ deploy_dir }}/prometheus"
      become: true

    - name: Render the compose file
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ deploy_dir }}/docker-compose.yml"
        owner: "{{ ansible_facts['user_id'] }}"
        mode: '0644'
      become: true

    - name: Render the environment file
      ansible.builtin.template:
        src: env.j2
        dest: "{{ deploy_dir }}/.env"
        owner: "{{ ansible_facts['user_id'] }}"
        mode: '0600'
      become: true
      no_log: true

    - name: Copy the Prometheus configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../prometheus/prometheus.yml"
        dest: "{{ deploy_dir }}/prometheus/prometheus.yml"
        owner: "{{ ansible_facts['user_id'] }}"
        mode: '0644'
      become: true

    - name: Copy the Grafana provisioning tree
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../grafana/"
        dest: "{{ deploy_dir }}/grafana/"
        owner: "{{ ansible_facts['user_id'] }}"
        mode: '0644'
        directory_mode: '0755'
      become: true

    - name: Ensure the stack is running
      community.docker.docker_compose_v2:
        project_src: "{{ deploy_dir }}"
        state: present
        pull: always
      become: true
