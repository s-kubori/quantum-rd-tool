name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  docker:
    name: docker build & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: quantum-rd-tool:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image size
        run: docker image ls quantum-rd-tool:ci

      - name: Start container
        run: |
          docker run -d --name qrd -p 8501:8501 \
            -e ANTHROPIC_API_KEY=dummy-key-for-smoke-test \
            -e STREAMLIT_SERVER_HEADLESS=true \
            -e STREAMLIT_BROWSER_GATHER_USAGE_STATS=false \
            quantum-rd-tool:ci

      - name: Smoke test the health endpoint
        run: |
          # 2秒間隔で最大30回 = 最大60秒待つ
          for i in $(seq 1 30); do
            # コンテナが既に終了していれば待つ意味がないので即失敗させる
            if ! docker ps --filter name=qrd --filter status=running -q | grep -q .; then
              echo "::error::container exited before becoming healthy"
              exit 1
            fi
            # -f でHTTPエラーを検出し、grep で本文が ok であることまで確認する
            if curl -fsS http://localhost:8501/_stcore/health | grep -q ok; then
              echo "healthy after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::health check did not pass within 60s"
          exit 1

      # The package is created private on first push. Making it public is a
      # one-off manual step - GHCR visibility cannot be set from a workflow:
      #   Repository -> Packages -> quantum-rd-tool -> Package settings
      #   -> Danger Zone -> Change package visibility -> Public
      # Subsequent pushes keep whatever visibility the package already has.
      - name: Push to GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dump container logs on failure
        if: failure()
        run: docker logs qrd || echo "container was never started"

      - name: Clean up the container
        if: always()
        run: docker rm -f qrd || true
